; Dune Awakening - Engine Settings
; Socket buffers, idle S2S ConnectionTimeout, and the net-rate flags that
; stop NumOutRec 2047 mesh overflows / player ack-window rubberbanding.
; Command-line -ini: args (from compose) take precedence; keep both in sync.
; Do NOT set IpNetDriver MaxClientRate=0 (unlimited) — that floods initial
; replication and clients fail with error 324. IgwNetDriver MaxClientRate=0
; is S2S-only and is required.
;
; Guard: bash scripts/assert-net-rate-flags.sh (CI + preflight).

[/Script/OnlineSubsystemUtils.IpNetDriver]
ServerDesiredSocketReceiveBufferBytes=16777216
ServerDesiredSocketSendBufferBytes=4194304
MaxClientRate=100000
MaxInternetClientRate=100000

[/Script/InfiniteGameWorlds.IgwNetDriver]
ConnectionTimeout=604800.0
MaxClientRate=0
ServerDesiredSocketReceiveBufferBytes=16777216
ServerDesiredSocketSendBufferBytes=4194304
