; Dune Awakening - Game Settings
; These settings apply to ALL servers in the battlegroup.
; Only shipped Funcom .ini keys and console variables are seeded here.
; Changes require a battlegroup restart to take effect.

; ---------------------------------------------------------------------------
; Network ports
; ---------------------------------------------------------------------------
[/Script/Seabass.SBGameState]
Port=7777
IGWPort=7888

; ---------------------------------------------------------------------------
; PvP, security zones, and player online state
; ---------------------------------------------------------------------------
[/Script/DuneSandbox.PvpPveSettings]
m_bShouldForceEnablePvpOnAllPartitions=False

[/Script/DuneSandbox.SecurityZonesSubsystem]
m_bAreSecurityZonesEnabled=True

[/Script/DuneSandbox.PlayerOnlineStateSettings]
; Bumped 300 -> 1800 (30 min) so brief network drops do not remove party state.
m_DefaultReconnectGracePeriodSeconds=1800
; Overmap specifically has a shorter grace period -- players must re-enter quickly.
m_OvermapReturnGracePeriodSeconds=90
; Grace period for instanced maps (story/dungeon instances).
m_InstancedMapReconnectGracePeriodSeconds=600

; ---------------------------------------------------------------------------
; Map FPS / Tick Rate
; DefaultGame.ini ships: HaggaBasin=20, DeepDesert=20, hubs/overland=10.
; Override format: -m_Maps removes default, +m_Maps adds replacement.
; Source: snapetech/DuneAwakeningSelfHost SERVER_CONFIG_KEY_INDEX.md
; ---------------------------------------------------------------------------
[/Script/DuneSandbox.MapFpsSettings]
; Raise survival from 20 → 30 FPS (40% more position corrections per second)
-m_Maps=(m_Map=(Name="HaggaBasin"), m_MaxFps=20)
+m_Maps=(m_Map=(Name="HaggaBasin"), m_MaxFps=30)
; Raise overland from 10 → 20 FPS
-m_Maps=(m_Map=(Name="Overland"), m_MaxFps=10)
+m_Maps=(m_Map=(Name="Overland"), m_MaxFps=20)
; Raise hubs from 10 → 20 FPS
-m_Maps=(m_Map=(Name="HarkoVillage"), m_MaxFps=10)
+m_Maps=(m_Map=(Name="HarkoVillage"), m_MaxFps=20)
-m_Maps=(m_Map=(Name="Arrakeen"), m_MaxFps=10)
+m_Maps=(m_Map=(Name="Arrakeen"), m_MaxFps=20)
-m_Maps=(m_Map=(Name="Arakkeen"), m_MaxFps=10)
+m_Maps=(m_Map=(Name="Arakkeen"), m_MaxFps=20)

; ---------------------------------------------------------------------------
; Sand decay off: buildings and placeables do not take sandstorm damage or
; accumulate sand buildup. Storms can still exist for weather/gameplay; this
; only stops the decay that eats bases. Requires a map restart to apply.
; ---------------------------------------------------------------------------
[/Script/DuneSandbox.BuildingSettings]
m_bMitigateAllSandstormDamage=True
m_SandBuildUpPlaceablesShelteredTargetValue=0.000000
m_SandBuildUpPlaceablesUnShelteredTargetValue=0.000000

[/Script/DuneSandbox.BiomeSettings]
m_SandBuildupMultiplier=0.0

[/Script/DuneSandbox.SandStormConfig]
m_SmallSandStormDamageConfig=(Player=5.000000,Building=0.000000,Placeable=0.000000,Vehicle=5.000000)
m_LargeSandStormDamageConfig=(Player=7.000000,Building=0.000000,Placeable=0.000000,Vehicle=7.000000)
